name: Bug report
description: Report a problem with DeepSeek Web Retrieval
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens, private URLs, or full logs with secrets.
        Redact keys as `sk-***`.

  - type: dropdown
    id: host
    attributes:
      label: Host and integration path
      options:
        - OpenCode native plugin
        - Pi native extension
        - Pi MCP fallback
        - Codex MCP
        - Another MCP client
        - Installer CLI
    validations:
      required: true

  - type: input
    id: host-version
    attributes:
      label: Host version
      description: Include Node.js or Bun version when relevant.
      placeholder: "Host name and version"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version or commit
      placeholder: "npm package version or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: install-mode
    attributes:
      label: Install mode
      options:
        - Installer CLI (project scope)
        - Installer CLI (global scope)
        - Host package manager
        - Manual MCP configuration
        - Global vendor path
        - Project vendor path
        - Auto-discovered plugin directory
        - Other
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Redacted config
      description: Include the relevant host config and installer command or capability tiers; redact secrets and private paths.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and private URLs.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed API keys and private URLs from this report.
          required: true
        - label: I searched existing issues first.
          required: true
