name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs exercise preparation and all checks, but never publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'gwokhou/deepseek-web-retrieval'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      tarball: ${{ steps.metadata.outputs.tarball }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Pin publishing npm
        run: npm install --global npm@11.21.0
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate version and extract release notes
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bun scripts/release.ts prepare "$RUNNER_TEMP/release"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack the release candidate
        run: npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/release" > "$RUNNER_TEMP/release/pack.json"
      - name: Check publication payload without publishing
        env:
          TARBALL: ${{ steps.metadata.outputs.tarball }}
        run: npm publish "$RUNNER_TEMP/release/$TARBALL" --dry-run --ignore-scripts --access public
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release
      - name: Check whether this exact package is already published
        id: registry
        run: bun scripts/release.ts status "$RUNNER_TEMP/release"
      - name: Publish to npm with OIDC
        if: steps.registry.outputs.exists != 'true'
        env:
          TARBALL: ${{ needs.prepare.outputs.tarball }}
        # Publish the checked artifact; the reusable CI already ran every gate.
        run: npm publish "$RUNNER_TEMP/release/$TARBALL" --ignore-scripts --provenance --access public --tag latest
      - name: Verify published integrity
        id: verified
        run: bun scripts/release.ts verify "$RUNNER_TEMP/release"
      - name: Create GitHub Release after npm succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IS_LATEST: ${{ steps.verified.outputs.latest }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > "$RUNNER_TEMP/existing-release.json"; then
            node --input-type=module -e 'import fs from "node:fs"; const r = JSON.parse(fs.readFileSync(process.argv[1])); if (r.isDraft || r.isPrerelease) throw new Error("Existing release is not a stable public release");' "$RUNNER_TEMP/existing-release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release/notes.md" --latest="$IS_LATEST"
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url
