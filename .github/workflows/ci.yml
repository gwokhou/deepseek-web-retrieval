name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      opencode-plugin: ${{ steps.set.outputs.opencode-plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Derive @opencode/plugin matrix from docs/hosts.jsonc
        id: set
        run: echo "opencode-plugin=$(bun run scripts/ci-matrix.ts)" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode-plugin: ${{ fromJson(needs.matrix.outputs.opencode-plugin) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pin @opencode/plugin
        run: bun add --no-save --exact @opencode/plugin@${{ matrix.opencode-plugin }}

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test
