name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode-plugin: ["2.0.32", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pin @opencode/plugin
        run: bun add --no-save --exact @opencode/plugin@${{ matrix.opencode-plugin }}

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
