name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      opencode-plugin: ${{ steps.set.outputs.opencode-plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Derive @opencode/plugin matrix from docs/hosts.jsonc
        id: set
        run: echo "opencode-plugin=$(bun run scripts/ci-matrix.ts)" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode-plugin: ${{ fromJson(needs.matrix.outputs.opencode-plugin) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pin @opencode/plugin
        run: bun add --no-save --exact @opencode/plugin@${{ matrix.opencode-plugin }}

      - name: Biome
        run: bun run lint:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Docs matrix in sync
        run: bun run scripts/render-matrix.ts --check

      - name: Test
        run: bun test

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:package

  keyless-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:keyless
